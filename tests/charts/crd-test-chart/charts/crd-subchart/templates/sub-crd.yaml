{{- if and (.Values.installCRDs) (.Values.global.installCRDs) }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.datarobot.com
{{- if .Values.global.keepCRDs }}
  annotations:
    helm.sh/resource-policy: keep
{{- end }}
spec:
  group: datarobot.com
  names:
    kind: Widget
    plural: widgets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
{{- end }}
